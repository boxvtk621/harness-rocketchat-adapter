name: ${COMPOSE_PROJECT_NAME:-hl304}

services:
  client:
    build:
      context: ./src/Client
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_CLIENT_PORT:-18100}:8080"
    configs:
      - source: client_runtime
        target: /usr/share/nginx/html/runtime-config.js
    depends_on:
      - gateway
      - centrifugo
    networks: [web, internal]
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.50" }

  gateway:
    build:
      context: ./src/Gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ADAPTER_BASE_URL: http://adapter:8080/
      ADAPTER_INTERNAL_TOKEN_FILE: /run/secrets/adapter_internal_token
      OIDC_METADATA_ADDRESS: http://keycloak:8080/realms/harness/.well-known/openid-configuration
      OIDC_ISSUER: http://localhost:${WEB_KEYCLOAK_PORT:-18180}/realms/harness
      OIDC_AUDIENCE: harness-web
      CENTRIFUGO_CLIENT_TOKEN_SECRET_FILE: /run/secrets/centrifugo_client_secret
    secrets: [adapter_internal_token, centrifugo_client_secret]
    depends_on: [adapter, keycloak]
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.75" }

  adapter:
    build:
      context: ..
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      MONGODB_CONNECTION_STRING_FILE: /run/secrets/mongodb_connection_string
      Mongo__Database: harness_adapter
      ADAPTER_INTERNAL_TOKEN_FILE: /run/secrets/adapter_internal_token
      Centrifugo__PublishUrl: http://centrifugo:8000/api/publish
      CENTRIFUGO_API_KEY_FILE: /run/secrets/centrifugo_api_key
      Harness__AllowedHosts: cursor-harness,codex-harness
      Harness__CaFile: /etc/ssl/certs/hl304-harness.crt
    secrets: [mongodb_connection_string, adapter_internal_token, centrifugo_api_key]
    configs:
      - source: harness_server_cert
        target: /etc/ssl/certs/hl304-harness.crt
    depends_on: [mongodb, centrifugo]
    networks: [internal, harness]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.75" }

  mongodb:
    image: mongo:8.0.16-noble
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongodb_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_root_password
    secrets: [mongodb_root_username, mongodb_root_password]
    volumes:
      - mongodb-data:/data/db
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.00" }

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/keycloak/bootstrap/start.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      DEV_USER_USERNAME: operator
      WEB_ORIGIN: http://localhost:${WEB_CLIENT_PORT:-18100}
    secrets: [keycloak_admin_password, keycloak_dev_user_password, keycloak_dev_viewer_password]
    configs:
      - source: keycloak_start
        target: /opt/keycloak/bootstrap/start.sh
        mode: 0555
      - source: keycloak_realm
        target: /opt/keycloak/data/import/harness-realm.json
    ports:
      - "127.0.0.1:${WEB_KEYCLOAK_PORT:-18180}:8080"
    command: ["start-dev", "--import-realm"]
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks: [web, internal]
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.00" }

  centrifugo:
    image: centrifugo/centrifugo:v5.4.8
    restart: unless-stopped
    environment:
      WEB_ORIGIN: http://localhost:${WEB_CLIENT_PORT:-18100}
    entrypoint: ["/bin/sh", "/centrifugo/bootstrap/start.sh"]
    secrets: [centrifugo_client_secret, centrifugo_api_key]
    configs:
      - source: centrifugo_start
        target: /centrifugo/bootstrap/start.sh
        mode: 0555
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.50" }

  cursor-harness:
    profiles: ["harness"]
    build:
      context: ${HARNESS_CURSOR_CONTEXT:-../../harness-cursor}
      dockerfile: delivery/Dockerfile.cursor
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        install -d -o 10001 -g 10001 -m 0700 /state/private /state/harness /state/cursor /state/cursor/home /provider-auth /workspace;
        install -o 10001 -g 10001 -m 0600 /run/secrets/harness_server_key /state/private/server.key;
        install -o 10001 -g 10001 -m 0644 /run/config/harness_server_cert /state/private/server.crt;
        exec setpriv --reuid=10001 --regid=10001 --clear-groups /harness-node --config /config/node.json
    networks: [harness, provider-egress]
    configs:
      - source: cursor_node_config
        target: /config/node.json
      - source: harness_policy
        target: /config/policy.txt
      - source: harness_tools_deny
        target: /config/tools-deny.json
      - source: harness_server_cert
        target: /run/config/harness_server_cert
    secrets: [harness_server_key]
    volumes:
      - cursor-harness-data:/state
      - cursor-provider-auth:/provider-auth
    # The runtime config is intentionally supplied only by deployment and is
    # mounted read-only there. No host port is published.
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.00" }

  codex-harness:
    profiles: ["harness"]
    build:
      context: ${HARNESS_CODEX_CONTEXT:-../../harness-codex}
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        install -d -o 10001 -g 10001 -m 0700 /state/private /state/harness /state/codex /state/codex/home /provider-auth /provider-auth/codex-home /workspace;
        install -o 10001 -g 10001 -m 0600 /run/secrets/harness_server_key /state/private/server.key;
        install -o 10001 -g 10001 -m 0644 /run/config/harness_server_cert /state/private/server.crt;
        exec setpriv --reuid=10001 --regid=10001 --clear-groups /harness-node --config /config/node.json
    networks: [harness, provider-egress]
    configs:
      - source: codex_node_config
        target: /config/node.json
      - source: harness_policy
        target: /config/policy.txt
      - source: harness_tools_deny
        target: /config/tools-deny.json
      - source: harness_server_cert
        target: /run/config/harness_server_cert
    secrets: [harness_server_key]
    volumes:
      - codex-harness-data:/state
      - codex-provider-auth:/provider-auth
    # The runtime config is intentionally supplied only by deployment and is
    # mounted read-only there. No host port is published.
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.00" }

  acceptance:
    profiles: ["acceptance"]
    build:
      context: ./tests/e2e
    environment:
      BASE_URL: http://localhost:${WEB_CLIENT_PORT:-18100}
      DEV_USER_USERNAME: operator
      DEV_USER_PASSWORD_FILE: /run/secrets/keycloak_dev_user_password
      HARNESS_CA_FILE: /run/config/harness_server_cert
      OUTPUT_DIR: /output
      API_BASE_URL: http://host.docker.internal:${WEB_CLIENT_PORT:-18100}
      ACCEPTANCE_ISOLATED: ${ACCEPTANCE_ISOLATED:-false}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-hl304}
      ACCEPTANCE_PROJECT_NAMESPACE: ${COMPOSE_PROJECT_NAME:-hl304}
    secrets: [keycloak_admin_password, keycloak_dev_user_password, keycloak_dev_viewer_password]
    configs:
      - source: harness_server_cert
        target: /run/config/harness_server_cert
    volumes:
      - ./output/acceptance:/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - client
      - keycloak
    networks: [web, harness]
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.00" }

configs:
  client_runtime:
    file: ${CLIENT_RUNTIME_CONFIG:-./src/Client/public/runtime-config.js}
  keycloak_start:
    file: ./infra/keycloak/start.sh
  keycloak_realm:
    file: ./infra/keycloak/harness-realm.json
  centrifugo_start:
    file: ./infra/centrifugo/start.sh
  cursor_node_config:
    file: ./infra/harness/cursor-node.json
  codex_node_config:
    file: ./infra/harness/codex-node.json
  harness_policy:
    file: ./infra/harness/policy.txt
  harness_tools_deny:
    file: ./infra/harness/tools-deny.json
  harness_server_cert:
    file: ./.runtime/harness/server.crt

secrets:
  adapter_internal_token: { file: ./.runtime/secrets/adapter_internal_token }
  centrifugo_client_secret: { file: ./.runtime/secrets/centrifugo_client_secret }
  centrifugo_api_key: { file: ./.runtime/secrets/centrifugo_api_key }
  keycloak_admin_password: { file: ./.runtime/secrets/keycloak_admin_password }
  keycloak_dev_user_password: { file: ./.runtime/secrets/keycloak_dev_user_password }
  keycloak_dev_viewer_password: { file: ./.runtime/secrets/keycloak_dev_viewer_password }
  mongodb_root_username: { file: ./.runtime/secrets/mongodb_root_username }
  mongodb_root_password: { file: ./.runtime/secrets/mongodb_root_password }
  mongodb_connection_string: { file: ./.runtime/secrets/mongodb_connection_string }
  harness_server_key: { file: ./.runtime/harness/server.key }

volumes:
  mongodb-data:
    name: ${HL304_VOLUME_PREFIX:-hl304}-mongodb-data
  keycloak-data:
    name: ${HL304_VOLUME_PREFIX:-hl304}-keycloak-data
  cursor-harness-data:
    name: ${HL304_VOLUME_PREFIX:-hl304}-cursor-harness-data
  codex-harness-data:
    name: ${HL304_VOLUME_PREFIX:-hl304}-codex-harness-data
  cursor-provider-auth:
    name: ${HL304_VOLUME_PREFIX:-hl304}-cursor-provider-auth
  codex-provider-auth:
    name: ${HL304_VOLUME_PREFIX:-hl304}-codex-provider-auth

networks:
  web:
    name: ${COMPOSE_PROJECT_NAME:-hl304}-web
  internal:
    name: ${COMPOSE_PROJECT_NAME:-hl304}-internal
    internal: true
  harness:
    name: ${COMPOSE_PROJECT_NAME:-hl304}-harness
    internal: true
  provider-egress:
    name: ${COMPOSE_PROJECT_NAME:-hl304}-provider-egress
